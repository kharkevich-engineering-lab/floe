# floe.standalone.toml — one binary, one bucket, one origin.
#
#   floe-server --config floe.standalone.toml
#   → http://floe.localhost:8080/   (plain HTTP on loopback; PORT=… moves it)
#
# Nothing in front of it: the web UI, the JSON API, smart HTTP (fetch/push),
# bundle-uri and LFS bytes are all served by this process from the bucket below.
# An edge that wants to take work over announces it per request with
# `X-Floe-Capabilities: …` (`accel-redirect`, honoured only when
# `server.accel_redirect = true`; see deploy/nginx.conf.example); hit directly,
# floe streams every byte itself.
#
# Prerequisites on this machine: `git` >= 2.46 (credential `authtype`, bundle URIs) and an
# S3-compatible or GCS bucket. `just dev-store` starts rustfs in a container for local play.
# Every key not set here keeps the default documented in floe.example.toml.

[server]
listen = "127.0.0.1:8080"                      # PORT env wins; also binds the ::1 twin
public_url = "http://floe.localhost:8080"    # browser origin; PORT rewrites the port
auto_create_on_push = true                     # `git push` to a repository that does not exist yet creates it
roles = []                                     # empty = every role: serve, maintain (checkpoints, bundles, compaction), events

[server.tls]
mode = "off"                      # loopback only, so plain HTTP. On a real name, terminate TLS here with
                                  # mode = "acme" (Let's Encrypt over DNS-01, see floe.example.toml) or
                                  # mode = "files" + cert/key (e.g. from mkcert for *.localhost), and set
                                  # public_url to https://.

[server.auth]
# Local play: everyone is `anon` with write. Nobody else can reach 127.0.0.1.
mode = "none"
#
# A shared machine — static tokens (bearer or the password of HTTP Basic):
# mode = "token"
# anonymous_read = false
# tokens = [
#   { principal = "alice", token_env = "FLOE_TOKEN_ALICE", write = true },
#   { principal = "ci",    token_env = "FLOE_TOKEN_CI",    write = false },
# ]
#
# A team — any OpenID Connect issuer (Google, Entra, Okta, Auth0, Keycloak, Dex, GitLab…):
# browsers sign in through the issuer, then mint git tokens at /_auth/tokens.
# mode = "oidc"
# anonymous_read = false
# issuer = "https://id.example.com"
# allowed_domains = ["example.com"]              # or allowed_emails = ["you@example.com"]
# oauth_client_id = "…"                          # redirect URI: <public_url>/_auth/callback
# oauth_client_secret = "…"                      #   (env: FLOE__SERVER__AUTH__OAUTH_CLIENT_SECRET)
# session_secret = "…at least 32 random bytes…"  #   (env: FLOE__SERVER__AUTH__SESSION_SECRET)
# audiences = ["floe-cli"]                     # optional ID-token audiences for non-browser clients

[store]
# The one durable thing; every host pointed at it serves the same repositories.
# This shape: rustfs (S3-compatible) in a container, started by `just dev-store` (compose.yaml;
# bucket floe-test, keys floe-dev / floe-dev-secret). Any S3 (AWS, MinIO, R2, Ceph…) is the
# same: set endpoint/region, point the key envs at your credentials.
backend = "s3"
bucket = "floe-test"
prefix = ""
[store.s3]
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
access_key_env = "AWS_ACCESS_KEY_ID"       # compose.yaml fixes floe-dev / floe-dev-secret for rustfs
secret_key_env = "AWS_SECRET_ACCESS_KEY"
force_path_style = true
# A GCS bucket instead (Application Default Credentials):
# backend = "gcs"
# bucket = "my-floe-bucket"
# prefix = ""

# Bundles (docs/BUNDLE_URI_DESIGN.md): one weekly full, then **chained** incrementals — each daily on the
# previous daily (the first on the weekly), each hourly on the previous hourly (restarting from every new
# daily). The list carries 1 weekly + <= 7 dailies + <= 24 hourlies, every one exactly its delta; git's
# creationToken heuristic downloads them newest-first until one whose prerequisites it has, so a catch-up
# is exactly the slots missed. floe.example.toml has the other shape (every incremental on its base).
[[bundles.strategy]]
name = "weekly"
kind = "full"
schedule = "0 0 23 * * Sun"
keep = 1
backfill_max = 1

[[bundles.strategy]]
name = "daily"
kind = "incremental"
base = "weekly"
schedule = "0 0 23 * * *"
chain = true

[[bundles.strategy]]
name = "hourly"
kind = "incremental"
base = "daily"
schedule = "0 0 * * * *"
chain = true

[github]                          # docs/GITHUB.md — a fake GitHub Enterprise Server over these repositories, so an app
enabled = true                    # that already supports GHES develops against floe: point its install's baseUrl at
                                  # http://127.0.0.1:8080/api/v3. Auth-free by construction (any bearer, one hardcoded
                                  # user, admin everywhere) — hence loopback only, and never deployed.

# The GitHub mirror (D49), the Iceberg audit tables (D50) and the events webhook are runtime configuration
# (D60): open http://floe.localhost:8080/_admin (every user is admin on loopback with auth mode "none"), or
#   floe --config floe.standalone.toml config set mirror.toml
# with a document such as
#   [github_mirror]
#   enabled = true
#   users = ["@me"]
#   token = { env = "FLOE_GITHUB_TOKEN" }    # or { value = "ghp_…" } with FLOE_CONFIG_KEY set (sealed)
#   private_visible_to_all_readers = true   # no per-repository read ACL; or include_private = false
#   [catalog]                               # a floe built with --features catalog;
#   enabled = true                          # `podman compose --profile catalog up -d`
#   uri = "http://127.0.0.1:9000/iceberg"   # RustFS S3 Tables, SigV4 (D63)
#   warehouse = "floe-catalog"
#   auth = "sigv4"
#   sigv4_service = "s3"
#   s3_endpoint = "http://127.0.0.1:9000"

[cache]
dir = "/tmp/floe"               # materialized repositories; wiped = warmth lost, nothing else
max_bytes = "20GiB"

[telemetry]
log_format = "pretty"
