<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#06101d" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f7fb" />
    <title>floe</title>
    <link rel="icon" type="image/svg+xml" href="./src/assets/logo.svg" />
    <!-- Colour theme: the Kharkevich Engineering Lab key and cycle (system → light → dark), applied before first paint. -->
    <script>!function(){try{var s=localStorage.getItem('kharkevich-theme');if(s!=='light'&&s!=='dark')s='system';var l=s==='light'||s==='system'&&matchMedia('(prefers-color-scheme: light)').matches;document.documentElement.classList.toggle('light',l)}catch(e){}}();</script>
    <style>
      /* Pre-JS boot state on the corporate tokens: painted from the HTML alone, replaced by the app on mount. */
      html { background: #06101d; color: #f2f7ff; --sk: #ffffff12; --sk2: #ffffff22; --ln: #36506a88 }
      html.light { background: #f4f7fb; color: #071523; --sk: #0715230f; --sk2: #0715231c; --ln: #1b3d602e }
      body { margin: 0 }
      .boot { font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif }
      .boot-bar { height: 64px; border-bottom: 1px solid var(--ln) }
      .boot-main { max-width: 1400px; margin: 32px auto; padding: 0 24px }
      .boot-sk { border-radius: 3px; background: linear-gradient(90deg, var(--sk) 25%, var(--sk2) 50%, var(--sk) 75%); background-size: 400% 100%; animation: boot-sh 1.4s ease infinite }
      @keyframes boot-sh { from { background-position: 100% 0 } to { background-position: 0 0 } }
      @media (prefers-reduced-motion: reduce) { .boot-sk { animation: none } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Loading floe">
        <div class="boot-bar"></div>
        <div class="boot-main">
          <div class="boot-sk" style="height:28px;width:260px;margin:4px 0 20px"></div>
          <div class="boot-sk" style="height:12px;width:70%;margin:11px 0"></div>
          <div class="boot-sk" style="height:12px;width:55%;margin:11px 0"></div>
          <div class="boot-sk" style="height:12px;width:80%;margin:11px 0"></div>
          <div class="boot-sk" style="height:12px;width:60%;margin:11px 0"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
