version: 2

# One weekly PR across every ecosystem (GitHub Actions, cargo, the web/ SPA and SDK):
# a multi-ecosystem group. https://docs.github.com/en/code-security/concepts/supply-chain-security/multi-ecosystem-updates
#
# `chore(deps)` is not a release type for semantic-release's commit-analyzer (only
# feat/fix/perf and breaking changes are), so a dependency bump never cuts a release on its
# own; a security fix that should ship gets a `fix:` commit by hand.
#
# Semver-major bumps now arrive in the same PR as everything else (there is no update-types
# filter), so the weekly PR may need code changes before it goes green.
#
# Schedule and commit-message are group-level only: setting commit-message on an ecosystem
# entry below is a configuration error.
multi-ecosystem-groups:
  all:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

updates:
  # Every action stays at its latest release; pins stay SHA + version comment.
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all

  # Rust dependencies.
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all

  # The SPA and SDK (web/).
  - package-ecosystem: npm
    directory: /web
    patterns: ["*"]
    multi-ecosystem-group: all
