name: Semantic Pull Request
on:
  pull_request_target:
    # labeled/unlabeled so adding or removing an ignoreLabels label re-runs the check.
    types: [opened, edited, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read
  statuses: write

jobs:
  main:
    name: Conventional commit title validation
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            perf
            revert
            refactor
            docs
            ci
            chore
            build
            test
          requireScope: false
          # Dependabot's multi-ecosystem group titles are generated ("chore(deps): Bump the
          # "all" group ...") with a capitalised subject we cannot configure; its PRs carry the
          # `dependencies` label, so skip the subject check for them. The chore(deps) prefix
          # comes from .github/dependabot.yml's commit-message setting.
          ignoreLabels: |
            dependencies
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
