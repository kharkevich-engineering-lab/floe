name: CI

# The repository had no build/test workflow: only pages.yml (a site deploy). A workspace that did
# not compile reached main because nothing ran cargo on push. This runs `just ci` — the same
# tiers AGENTS.md documents (warnings, clippy, test, e2e) — so CI and a contributor's laptop cannot drift.
# The tier definitions live in the justfile, never duplicated here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: warnings + test (${{ matrix.arch }})
    # Native on both architectures floe ships for (see release.yml): one runner per arch,
    # never qemu. fail-fast off: a failure on one arch and not the other is the signal.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # prost-build does not vendor protoc; without it the proto crate fails with NotFound.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # No toolchain version here on purpose: rust-toolchain.toml pins it (and its components).
      # `rustup show` installs exactly that, so the pin has one home. The arm64 runner image
      # may lack rustup, so bootstrap it (no default toolchain) when it is missing.
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            # A fixed rustup-init checked against a hash pinned here, never `curl | sh` of
            # whatever sh.rustup.rs serves today. Bump RUSTUP and both hashes together.
            RUSTUP=1.29.1
            case "$(uname -m)" in
              aarch64) triple=aarch64-unknown-linux-gnu; sum=15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433 ;;
              x86_64) triple=x86_64-unknown-linux-gnu; sum=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71 ;;
              *) echo "::error::no pinned rustup-init for $(uname -m)"; exit 1 ;;
            esac
            curl --proto '=https' --tlsv1.2 -sSfo "$RUNNER_TEMP/rustup-init" "https://static.rust-lang.org/rustup/archive/${RUSTUP}/${triple}/rustup-init"
            echo "${sum}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/rustup-init"
            "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
        with:
          # Per arch: an x86_64 target/ restored onto arm64 is gigabytes of useless download.
          key: scoped-tests-v1-${{ matrix.arch }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Required, not cosmetic: build.rs only writes a placeholder index.html, and api_v1's
      # v1_surface_and_browser_lane asserts /repos.js and /repos.mjs are served 200. Also runs
      # oxlint --deny-warnings and tsc --noEmit, so the web gate is covered here too.
      - name: Build the SPA and the SDK
        run: just web-build

      - name: Compile cold workspace before timed checks
        timeout-minutes: 45
        run: |
          cargo build --workspace --all-targets --locked
          # Package subsets resolve different dependency features than the workspace build.
          cargo test -p floe-store -p floe-git -p floe-wal -p floe-bundle --tests --no-run --locked
          cargo test -p floe-server --tests --no-run --locked
      - run: just test
      - run: just warnings
      - run: just clippy

  e2e:
    name: Git and editor contracts (${{ matrix.arch }})
    # Native on both architectures floe ships for (see release.yml): one runner per arch,
    # never qemu. fail-fast off: a failure on one arch and not the other is the signal.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            # A fixed rustup-init checked against a hash pinned here, never `curl | sh` of
            # whatever sh.rustup.rs serves today. Bump RUSTUP and both hashes together.
            RUSTUP=1.29.1
            case "$(uname -m)" in
              aarch64) triple=aarch64-unknown-linux-gnu; sum=15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433 ;;
              x86_64) triple=x86_64-unknown-linux-gnu; sum=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71 ;;
              *) echo "::error::no pinned rustup-init for $(uname -m)"; exit 1 ;;
            esac
            curl --proto '=https' --tlsv1.2 -sSfo "$RUNNER_TEMP/rustup-init" "https://static.rust-lang.org/rustup/archive/${RUSTUP}/${triple}/rustup-init"
            echo "${sum}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/rustup-init"
            "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: contracts-v1-${{ matrix.arch }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the SPA and the SDK
        run: just web-build
      - name: Compile cold contract binaries before timed tests
        id: contracts
        timeout-minutes: 45
        run: cargo test -p floe-server --test e2e --test github --test github_reads --test github_graphql --test github_prs --test github_webhooks --test events --no-run --locked
      - name: Editor facade contracts
        shell: bash
        run: just test-editor 2>&1 | tee editor-contracts.log
      - name: Git protocol contracts
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' }}
        shell: bash
        run: just e2e 2>&1 | tee git-contracts.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-logs-${{ matrix.arch }}
          path: '*-contracts.log'
          retention-days: 14

  container:
    name: release container (${{ matrix.arch }})
    # Both arches the release workflow publishes, each on a native runner: the release
    # run on main must never be the first time the Containerfile is built for arm64.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs-on: blacksmith-4vcpu-ubuntu-2204
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - if: matrix.arch == 'amd64'
        uses: useblacksmith/setup-docker-builder@v1
      - name: Build release image without publishing
        if: matrix.arch == 'amd64'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          build-args: FLOE_BUILD_SHA=${{ github.sha }}
          tags: floe:smoke
      # Blacksmith has no arm64 builder; the same build on GitHub's native arm64 runner.
      - if: matrix.arch == 'arm64'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build release image without publishing
        if: matrix.arch == 'arm64'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          build-args: FLOE_BUILD_SHA=${{ github.sha }}
          tags: floe:smoke
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}
      - name: Start S3-compatible test store
        run: |
          docker compose up -d --wait rustfs
          docker compose run --rm create-bucket
      - name: Start packaged facade
        run: |
          docker run -d --name floe-smoke --network host \
            -e AWS_ACCESS_KEY_ID=floe-dev \
            -e AWS_SECRET_ACCESS_KEY=floe-dev-secret \
            -e FLOE__STORE__BUCKET=floe-test \
            -e FLOE__STORE__S3__REGION=us-east-1 \
            -e FLOE__STORE__S3__ENDPOINT=http://127.0.0.1:9000 \
            -e FLOE__STORE__S3__FORCE_PATH_STYLE=true \
            -e FLOE__SERVER__PUBLIC_URL=http://127.0.0.1:8097 \
            floe:smoke
      - name: Verify editor publish, concurrent Git, and cold webhook recovery
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p smoke-logs
          python3 -u scripts/container-smoke.py 2>&1 | tee smoke-logs/test.log
      - name: Container logs
        if: always()
        run: |
          mkdir -p smoke-logs
          docker logs floe-smoke > smoke-logs/facade.log 2>&1 || true
          docker compose logs rustfs > smoke-logs/store.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-container-logs-${{ matrix.arch }}
          path: smoke-logs/
          retention-days: 14
      - name: Clean up
        if: always()
        run: |
          docker rm -fv floe-smoke || true
          docker compose down -v
