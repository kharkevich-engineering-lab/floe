            esac
            curl --proto '=https' --tlsv1.2 -sSfo "$RUNNER_TEMP/rustup-init" "https://static.rust-lang.org/rustup/archive/${RUSTUP}/${triple}/rustup-init"
            echo "${sum}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/rustup-init"
            "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show && cargo --version && git --version
          # Only the pinned toolchain stays: rust-cache hashes every installed toolchain into its
          # key, so the image's preinstalled `stable` would drop the whole cache on each image bump.
          active="$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup toolchain list | cut -d' ' -f1 | grep -vxF "$active" | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: codeintel-v1-${{ matrix.arch }}
          cache-on-failure: true
          # Written from main only, restored everywhere (see the header).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just
      - name: Compile the codeintel feature build before timed checks
        timeout-minutes: 45
        run: |
          cargo test -p floe-server --features mcp --test mcp_spike --no-run --locked
          cargo test -p floe-codeintel --no-default-features --no-run --locked
      - run: just test-codeintel
      - run: just clippy-codeintel

  acme-pebble:
    name: ACME against Pebble (${{ matrix.arch }})
    # D59: the whole DNS-01 flow (account, order with a wildcard, TXT records, propagation check,
    # finalize, sealed bucket state, a second instance picking the certificate up, renewal
    # hot-swap, a verified handshake) against letsencrypt/pebble with pebble-challtestsrv as the
    # DNS. Its own job: it compiles only floe-tls (+ the store's memory backend), not the server.
    needs: changes
    if: needs.changes.outputs.tls == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            RUSTUP=1.29.1
            case "$(uname -m)" in
              aarch64) triple=aarch64-unknown-linux-gnu; sum=15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433 ;;
              x86_64) triple=x86_64-unknown-linux-gnu; sum=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71 ;;
              *) echo "::error::no pinned rustup-init for $(uname -m)"; exit 1 ;;
            esac
            curl --proto '=https' --tlsv1.2 -sSfo "$RUNNER_TEMP/rustup-init" "https://static.rust-lang.org/rustup/archive/${RUSTUP}/${triple}/rustup-init"
            echo "${sum}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/rustup-init"
            "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show && cargo --version
          active="$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup toolchain list | cut -d' ' -f1 | grep -vxF "$active" | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: acme-pebble-v1-${{ matrix.arch }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile the test binaries
        timeout-minutes: 30
        run: cargo test -p floe-tls --tests --no-run --locked
      - name: Start Pebble and pebble-challtestsrv
        run: |
          # Host network: Pebble asks challtestsrv (127.0.0.1:8053) for _acme-challenge TXT records,
          # the test publishes them through challtestsrv's management API (:8055) and checks
          # propagation against the same DNS. No sleeps, no nonce rejection: deterministic.
          docker run -d --name challtestsrv --network host ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1 \
            -defaultIPv6 "" -defaultIPv4 127.0.0.1 -http01 "" -https01 "" -tlsalpn01 "" -doh "" \
            -dnsserver 127.0.0.1:8053 -management 127.0.0.1:8055
          docker run -d --name pebble --network host -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 \
            ghcr.io/letsencrypt/pebble:2.10.1 -config /test/config/pebble-config.json -dnsserver 127.0.0.1:8053
          docker cp pebble:/test/certs/pebble.minica.pem "$RUNNER_TEMP/pebble.minica.pem"
          for _ in $(seq 1 30); do
            curl -fsS --cacert "$RUNNER_TEMP/pebble.minica.pem" https://localhost:14000/dir >/dev/null && break
            sleep 1
          done
          curl -fsS --cacert "$RUNNER_TEMP/pebble.minica.pem" https://localhost:14000/dir
      - name: ACME flow against Pebble
        timeout-minutes: 10
        env:
          FLOE_TEST_PEBBLE_DIRECTORY: https://localhost:14000/dir
          FLOE_TEST_PEBBLE_MANAGEMENT: https://localhost:15000
          FLOE_TEST_CHALLTESTSRV: http://127.0.0.1:8055
          FLOE_TEST_PEBBLE_DNS: 127.0.0.1:8053
        run: |
          export FLOE_TEST_PEBBLE_CA="$RUNNER_TEMP/pebble.minica.pem"
          cargo test -p floe-tls --locked --test pebble -- --ignored --nocapture
      - name: Service logs
        if: always()
        run: |
          docker logs pebble 2>&1 | tail -200 || true
          docker logs challtestsrv 2>&1 | tail -100 || true
      - name: Clean up
        if: always()
        run: docker rm -fv pebble challtestsrv || true

  container:
    name: release container (${{ matrix.arch }})
    # On a PR whenever anything the image is built from changes; always on main and by hand.
    needs: changes
    if: needs.changes.outputs.container == 'true'
    # Each arch on a native runner. Both arches the release publishes whenever the build recipe
    # changes, so the release run on main is never the first arm64 build of a new Containerfile;
    # amd64 alone for a source-only PR (the `changes` job builds the matrix).
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.container_matrix) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build release image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          build-args: FLOE_BUILD_SHA=${{ github.sha }}
          tags: floe:smoke
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          # Written from main only, like the Rust caches: mode=max layers from every PR push
          # crowd the 10 GB cache budget.
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope=ci-{0}', matrix.arch) || '' }}
      - name: Start S3-compatible test store
        run: |
          docker compose up -d --wait rustfs
          docker compose run --rm create-bucket
      - name: Start packaged facade
        run: |
          docker run -d --name floe-smoke --network host \
            -e AWS_ACCESS_KEY_ID=floe-dev \
            -e AWS_SECRET_ACCESS_KEY=floe-dev-secret \
            -e FLOE__STORE__BUCKET=floe-test \
            -e FLOE__STORE__S3__REGION=us-east-1 \
            -e FLOE__STORE__S3__ENDPOINT=http://127.0.0.1:9000 \
            -e FLOE__STORE__S3__FORCE_PATH_STYLE=true \
            -e FLOE__SERVER__PUBLIC_URL=http://127.0.0.1:8097 \
            floe:smoke
      - name: Verify editor publish, concurrent Git, and cold webhook recovery
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p smoke-logs
          python3 -u scripts/container-smoke.py 2>&1 | tee smoke-logs/test.log
      - name: Container logs
        if: always()
        run: |
          mkdir -p smoke-logs
          docker logs floe-smoke > smoke-logs/facade.log 2>&1 || true
          docker compose logs rustfs > smoke-logs/store.log 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: editor-container-logs-${{ matrix.arch }}
          path: smoke-logs/
          retention-days: 14
      - name: Clean up
        if: always()
        run: |
          docker rm -fv floe-smoke || true
          docker compose down -v

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image ships rustup; rust-toolchain.toml pins the toolchain and lists rustfmt.
      - name: Install the pinned Rust toolchain
        run: rustup show && cargo fmt --version
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just
      - run: just fmt-check

  msrv:
    name: MSRV (x86_64)
    # `cargo check` on the workspace's rust-version (Cargo.toml, the one home of the number), so
    # a newer std API cannot land under a floor that claims otherwise. One arch: the MSRV is a
    # property of the source, not of the target.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Before rust-cache, so its key covers the MSRV toolchain.
      - name: Install the MSRV toolchain
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-v1
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just
      - run: just msrv

  deny:
    name: cargo-deny
    # Advisories, licences, bans and sources (deny.toml). On a PR only when the dependency
    # graph or the policy changes; the nightly workflow runs it daily for new advisories.
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just,cargo-deny@0.20.2
      - run: just deny

  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A fixed release checked against a hash pinned here. Bump VERSION and the hash together
      # (actionlint_<v>_checksums.txt). shellcheck, preinstalled on the image, lints run: blocks.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfLo "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'

  helm:
    name: Helm chart
    # deploy/helm/floe is a thin chart over the `common` library (oci://ghcr.io/technicaldomain/helm):
    # the dependency must resolve to what Chart.lock records, every values file under ci/ must lint
    # and render to manifests Kubernetes 1.33 accepts (kubeconform -strict, CRD schemas from the
    # datree catalog for the monitors and the HTTPRoute), and the dev values must install into kind
    # against RustFS and serve git. The chart is arch-independent: one runner.
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: deploy/helm/floe
    env:
      # Fixed releases checked against hashes pinned here; bump a version and its hash together.
      HELM_VERSION: 4.1.1
      HELM_SHA256: 5d4c7623283e6dfb1971957f4b755468ab64917066a8567dd50464af298f4031
      KUBECONFORM_VERSION: 0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # datreeio/CRDs-catalog at a fixed commit (ServiceMonitor, PodMonitor, VMServiceScrape, HTTPRoute).
      CRDS_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/fd90051867733c60d32d16450556e9cd18459aef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm and kubeconform
        working-directory: ${{ runner.temp }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSfLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 -sSfLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          mkdir -p bin
          tar -xzf helm.tgz -C bin --strip-components=1 linux-amd64/helm
          tar -xzf kubeconform.tgz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          bin/helm version && bin/kubeconform -v
      - name: Dependency update matches Chart.lock
        run: |
          if [ ! -f Chart.lock ]; then
            echo "::error::Chart.lock is missing: run helm dependency update once the common version in Chart.yaml is published"
            exit 1
          fi
          helm dependency update
          # Only the timestamp may change: same dependency, same version, same digest.
          git diff -I '^generated:' --exit-code Chart.lock
      - name: Lint
        run: |
          helm lint --strict .
          for values in ci/*-values.yaml; do
            helm lint --strict . -f "$values"
          done
      - name: Render and validate
        run: |
          for values in ci/*-values.yaml; do
            echo "::group::${values}"
            helm template floe . --namespace floe -f "$values" > "$RUNNER_TEMP/rendered.yaml"
            kubeconform -strict -summary -kubernetes-version 1.33.0 \
              -schema-location default \
              -schema-location "${CRDS_CATALOG}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              "$RUNNER_TEMP/rendered.yaml"
            echo "::endgroup::"
          done
      # kind is preinstalled on the runner image (its version picks the node image).
      - name: Install into kind against RustFS
        timeout-minutes: 12
        run: |
          kind create cluster --name floe --wait 120s
          kubectl create namespace floe
          kubectl -n floe apply -f ci/kind/rustfs.yaml
          kubectl -n floe wait --for=condition=complete job/create-bucket --timeout=180s
          helm install floe . --namespace floe -f ci/dev-rustfs-values.yaml --wait --timeout 5m
          kubectl -n floe port-forward svc/floe-floe 8097:80 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8097/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8097/readyz
          echo
          # /metrics is behind auth: 401 without the token, 200 with it.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/metrics)" = 401
          curl -fsS -o /dev/null -H 'Authorization: Bearer floe-dev-admin-token' http://127.0.0.1:8097/metrics
          # A push creates the repository; a clone reads it back (read-only root filesystem).
          export GIT_CONFIG_GLOBAL=/dev/null
          auth='http.extraHeader=Authorization: Bearer floe-dev-admin-token'
          work="$RUNNER_TEMP/git" && mkdir -p "$work" && cd "$work"
          git init -q -b main src && echo smoke > src/README && git -C src add README
          git -C src -c user.name=ci -c user.email=ci@example.com commit -qm smoke
          git -C src -c "$auth" push -q http://127.0.0.1:8097/smoke/chart.git main
          git -c "$auth" -c transfer.bundleURI=false clone -q http://127.0.0.1:8097/smoke/chart.git out
          test "$(cat out/README)" = smoke
      - name: Cluster state
        if: always()
        run: |
          kubectl -n floe get all,pvc,configmap,secret 2>/dev/null || true
          kubectl -n floe describe deploy/floe-floe 2>/dev/null | tail -40 || true
          kubectl -n floe logs deploy/floe-floe --tail=200 2>/dev/null || true
          kind delete cluster --name floe || true

  # The one check branch protection requires. Green when every job succeeded or was skipped by
  # its path filter; red on any failure or cancellation — including `changes` itself failing,
  # which would otherwise skip everything downstream and look like a docs-only PR.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, fmt, build-test, e2e, catalog, codeintel, acme-pebble, container, msrv, deny, actionlint, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped by design
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) (\(.value.result))"] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not green: ${bad}"
            exit 1
          fi
