name: CI

# The repository had no build/test workflow: only pages.yml (a site deploy). A workspace that did
# not compile reached main because nothing ran cargo on push. This runs `just ci` — the same
# tiers AGENTS.md documents (warnings, clippy, test, e2e, and the catalog feature build) — split
# into jobs, so CI and a contributor's laptop cannot drift.
# The tier definitions live in the justfile, never duplicated here.
#
# A pull request runs only what its changed paths need (the `changes` job below; the table is
# in AGENTS.md §5). Push to main and workflow_dispatch run everything. Branch protection
# requires the one aggregate check, `CI result`, which passes when every job either succeeded
# or was skipped by its path filter — so a skipped job never blocks a merge and never hides a
# failure.
#
# Rust caches are written from main only (`save-if`) and restored everywhere: every PR push
# saving ~5 GB of target/ blew through the repository's 10 GB cache budget, the LRU evicted
# the next run's cache, and x86_64 recompiled the world cold (17 min) on most runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Which groups of jobs this change needs. On a pull request, from the PR's file list (the
  # API, no checkout); on push to main and workflow_dispatch, everything.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Anything but docs: the Rust build, tests and contracts (the SPA is embedded, so web/ too).
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      # The Rust sources and what compiles them: rustfmt, MSRV, the catalog and codeintel feature builds.
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      # Everything the Containerfile COPYs (plus the smoke test's inputs): the image is rebuilt and
      # smoke-tested for any change that can reach it.
      container: ${{ github.event_name != 'pull_request' || steps.filter.outputs.container == 'true' }}
      # Which arches: both when the build recipe itself changes (base images, toolchain, lockfiles,
      # the Containerfile), and on main/by hand; amd64 only for source-only changes, whose
      # per-arch compile and tests the warnings + test job already covers natively.
      container_matrix: ${{ steps.matrix.outputs.container }}
      # floe-tls and the crates it compiles against (the ACME/Pebble job builds nothing else).
      tls: ${{ github.event_name != 'pull_request' || steps.filter.outputs.tls == 'true' }}
      deny: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deny == 'true' }}
      actions: ${{ github.event_name != 'pull_request' || steps.filter.outputs.actions == 'true' }}
      # The Helm chart (deploy/helm/floe): lint, render, kubeconform, a kind install.
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.helm == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!site/**'
              - '!LICENSE'
              - '!NOTICE'
              - '!deploy/helm/**'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'clippy.toml'
              - 'justfile'
              - '.github/workflows/**'
            container:
              - 'Containerfile'
              - '.dockerignore'
              - 'compose.yaml'
              - 'deploy/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'web/**'
              - '!**/*.md'
              - 'scripts/**'
              - '.github/workflows/**'
              - '!deploy/helm/**'
            container_recipe:
              - 'Containerfile'
              - '.dockerignore'
              - 'compose.yaml'
              - 'deploy/**'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'web/package.json'
              - 'web/pnpm-lock.yaml'
              - 'scripts/**'
              - '.github/workflows/**'
              - '!deploy/helm/**'
            tls:
              - 'crates/floe-tls/**'
              - 'crates/floe-store/**'
              - 'crates/floe-config/**'
              - 'crates/floe-proto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/**'
            deny:
              - 'Cargo.lock'
              - 'deny.toml'
            actions:
              - '.github/**'
            helm:
              - 'deploy/helm/**'
              - '.github/workflows/**'
      - id: matrix
        env:
          BOTH: ${{ github.event_name != 'pull_request' || steps.filter.outputs.container_recipe == 'true' }}
        run: |
          amd64='{"arch":"amd64","platform":"linux/amd64","runs-on":"ubuntu-latest"}'
          arm64='{"arch":"arm64","platform":"linux/arm64","runs-on":"ubuntu-24.04-arm"}'
          if [ "$BOTH" = true ]; then m="[${amd64},${arm64}]"; else m="[${amd64}]"; fi
          echo "container=${m}" >> "$GITHUB_OUTPUT"

  build-test:
    name: warnings + test (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Native on both architectures floe ships for (see release.yml): one runner per arch,
    # never qemu. fail-fast off: a failure on one arch and not the other is the signal.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # prost-build does not vendor protoc; without it the proto crate fails with NotFound.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # No toolchain version here on purpose: rust-toolchain.toml pins it (and its components).
      # `rustup show` installs exactly that, so the pin has one home. The arm64 runner image
      # may lack rustup, so bootstrap it (no default toolchain) when it is missing.
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            # A fixed rustup-init checked against a hash pinned here, never `curl | sh` of
            # whatever sh.rustup.rs serves today. Bump RUSTUP and both hashes together.
            RUSTUP=1.29.1
            case "$(uname -m)" in
              aarch64) triple=aarch64-unknown-linux-gnu; sum=15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433 ;;
              x86_64) triple=x86_64-unknown-linux-gnu; sum=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71 ;;
              *) echo "::error::no pinned rustup-init for $(uname -m)"; exit 1 ;;
            esac
            curl --proto '=https' --tlsv1.2 -sSfo "$RUNNER_TEMP/rustup-init" "https://static.rust-lang.org/rustup/archive/${RUSTUP}/${triple}/rustup-init"
            echo "${sum}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/rustup-init"
            "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show && cargo --version && git --version
          # Only the pinned toolchain stays: rust-cache hashes every installed toolchain into its
          # key, so the image's preinstalled `stable` would drop the whole cache on each image bump.
          active="$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup toolchain list | cut -d' ' -f1 | grep -vxF "$active" | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Per arch: an x86_64 target/ restored onto arm64 is gigabytes of useless download.
          key: scoped-tests-v1-${{ matrix.arch }}
          cache-on-failure: true
          # Written from main only, restored everywhere (see the header).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Required, not cosmetic: build.rs only writes a placeholder index.html, and api_v1's
      # v1_surface_and_browser_lane asserts /repos.js and /repos.mjs are served 200. Also runs
      # oxlint --deny-warnings and tsc --noEmit, so the web gate is covered here too.
      - name: Build the SPA and the SDK
        run: just web-build

      - name: Compile cold workspace before timed checks
        timeout-minutes: 45
        run: |
          cargo build --workspace --all-targets --locked
          # Package subsets resolve different dependency features than the workspace build.
          cargo test -p floe-store -p floe-git -p floe-wal -p floe-bundle -p floe-tls --tests --no-run --locked
          cargo test -p floe-server --tests --no-run --locked
      - run: just test
      - name: Upload code-intel golden mismatches
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeintel-golden-actual-${{ matrix.arch }}
          path: target/tmp/golden/
          if-no-files-found: ignore
          retention-days: 7
      - run: just warnings
      - run: just clippy

  e2e:
    name: Git and editor contracts (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Native on both architectures floe ships for (see release.yml): one runner per arch,
    # never qemu. fail-fast off: a failure on one arch and not the other is the signal.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            # A fixed rustup-init checked against a hash pinned here, never `curl | sh` of
            # whatever sh.rustup.rs serves today. Bump RUSTUP and both hashes together.
            RUSTUP=1.29.1
            case "$(uname -m)" in
              aarch64) triple=aarch64-unknown-linux-gnu; sum=15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433 ;;
              x86_64) triple=x86_64-unknown-linux-gnu; sum=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71 ;;
              *) echo "::error::no pinned rustup-init for $(uname -m)"; exit 1 ;;
            esac
            curl --proto '=https' --tlsv1.2 -sSfo "$RUNNER_TEMP/rustup-init" "https://static.rust-lang.org/rustup/archive/${RUSTUP}/${triple}/rustup-init"
            echo "${sum}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/rustup-init"
            "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show && cargo --version && git --version
          # Only the pinned toolchain stays: rust-cache hashes every installed toolchain into its
          # key, so the image's preinstalled `stable` would drop the whole cache on each image bump.
          active="$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup toolchain list | cut -d' ' -f1 | grep -vxF "$active" | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: contracts-v1-${{ matrix.arch }}
          cache-on-failure: true
          # Written from main only, restored everywhere (see the header).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the SPA and the SDK
        run: just web-build
      - name: Compile cold contract binaries before timed tests
        id: contracts
        timeout-minutes: 45
        run: cargo test -p floe-server --test e2e --test github --test github_reads --test github_graphql --test github_prs --test github_webhooks --test events --test sim --no-run --locked
      - name: Editor facade contracts
        shell: bash
        run: just test-editor 2>&1 | tee editor-contracts.log
      - name: Git protocol contracts
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' }}
        shell: bash
        run: just e2e 2>&1 | tee git-contracts.log
      # Principle IV's check (AGENTS.md §3): crash, partition, stale, lost-response and orphan
      # scenarios over one truth store, with the default seeds (~25 s). Random seeds and the two
      # skipped flaky tests run nightly; drop each --skip when its issue (#12, #14) is fixed.
      - name: Simulation suite
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: |
          just sim \
            --skip sim_cache_pressure_keeps_pinned_repos_and_refuses_too_large \
            --skip base_rebuild_resumes_after_a_kill_between_any_two_phases \
            2>&1 | tee sim-contracts.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: contract-test-logs-${{ matrix.arch }}
          path: '*-contracts.log'
          retention-days: 14

  catalog:
    name: catalog feature (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # The release image and tarballs are built with `--features catalog` (Containerfile), so the
    # feature build is linted and tested here, natively per arch. Its own job and cache: arrow,
    # parquet and iceberg are a second dependency graph the default build never compiles. The
    # recipes (`just clippy-catalog`, `just test-catalog-lib`) are the tier definitions.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            # A fixed rustup-init checked against a hash pinned here, never `curl | sh` of
            # whatever sh.rustup.rs serves today. Bump RUSTUP and both hashes together.
            RUSTUP=1.29.1
            case "$(uname -m)" in
              aarch64) triple=aarch64-unknown-linux-gnu; sum=15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433 ;;
              x86_64) triple=x86_64-unknown-linux-gnu; sum=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71 ;;
              *) echo "::error::no pinned rustup-init for $(uname -m)"; exit 1 ;;
            esac
            curl --proto '=https' --tlsv1.2 -sSfo "$RUNNER_TEMP/rustup-init" "https://static.rust-lang.org/rustup/archive/${RUSTUP}/${triple}/rustup-init"
            echo "${sum}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/rustup-init"
            "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show && cargo --version && git --version
          # Only the pinned toolchain stays: rust-cache hashes every installed toolchain into its
          # key, so the image's preinstalled `stable` would drop the whole cache on each image bump.
          active="$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup toolchain list | cut -d' ' -f1 | grep -vxF "$active" | xargs -r -n1 rustup toolchain uninstall
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: catalog-v1-${{ matrix.arch }}
          cache-on-failure: true
          # Written from main only, restored everywhere (see the header).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just
      - name: Compile the catalog feature build before timed checks
        timeout-minutes: 45
        run: cargo test -p floe-catalog -p floe-server -p floe-cli --lib --features floe-cli/catalog,floe-catalog/iceberg --no-run --locked
      - run: just test-catalog-lib
      - run: just clippy-catalog

  codeintel:
    name: codeintel features (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # The code-intelligence feature build (D52): floe-server and floe-cli with `--features mcp`
    # (implies codeintel: tree-sitter grammars and rmcp), a dependency graph the default build
    # never compiles, so its own job and cache, natively per arch. The recipes
    # (`just clippy-codeintel`, `just test-codeintel`) are the tier definitions.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            # A fixed rustup-init checked against a hash pinned here, never `curl | sh` of
            # whatever sh.rustup.rs serves today. Bump RUSTUP and both hashes together.
            RUSTUP=1.29.1
            case "$(uname -m)" in
              aarch64) triple=aarch64-unknown-linux-gnu; sum=15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433 ;;
              x86_64) triple=x86_64-unknown-linux-gnu; sum=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71 ;;
