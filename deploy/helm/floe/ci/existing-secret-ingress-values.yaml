# Production behind ingress-nginx: Secrets managed outside the chart, IRSA for the bucket.
replicas: 3
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/floe
sharedSecrets: [floe-credentials]       # FLOE_TOKEN_ADMIN, FLOE__SERVER__AUTH__SESSION_SECRET, …
secretRefs:
  FLOE_CONFIG_KEY: {name: floe-config-key, key: key}
env:
  - {name: FLOE__STORE__BUCKET, value: acme-floe}
  - {name: FLOE__SERVER__PUBLIC_URL, value: "https://git.example.com"}
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: git.example.com
      paths: [{path: /}]
  tls:
    - secretName: git-example-com-tls
      hosts: [git.example.com]
