# Runtime defaults for the facade image (Containerfile).
# The deployment supplies the bucket, region and public origin (FLOE__ overrides). Integrations are
# registered through the `_dev` API (docs/GITHUB.md §11).
[server]
listen = "0.0.0.0:8097"
auto_create_on_push = true

[server.auth]
mode = "none"

[server.tls]
mode = "off"

[bundles]
enabled = false
advertise = false

[github]
enabled = true
webhook_poll_interval = "1s"

[store]
backend = "s3"
prefix = ""

[store.s3]
# Let the AWS SDK choose its endpoint from the injected region.
endpoint = ""
force_path_style = false

[cache]
dir = "/var/lib/floe"
max_bytes = "5GiB"

[telemetry]
log_format = "json"
log_filter = "info"

# Runtime configuration — the GitHub mirror (D49), the catalog (D50), the events webhook — is not in this
# file: it is the versioned config document in the bucket (D60), edited at https://<host>/_admin or with
# `floe config set|import`. Secrets entered there are sealed with FLOE_CONFIG_KEY (D61).
