# Runtime defaults for the facade image (Containerfile).
# The deployment supplies the bucket, region and public origin (FLOE__ overrides). Integrations are
# registered through the `_dev` API (docs/GITHUB.md §11).
[server]
listen = "0.0.0.0:8097"
auto_create_on_push = true

[server.auth]
mode = "none"

[server.tls]
mode = "off"

[bundles]
enabled = false
advertise = false

[github]
enabled = true
webhook_poll_interval = "1s"

[store]
backend = "s3"
prefix = ""

[store.s3]
# Let the AWS SDK choose its endpoint from the injected region.
endpoint = ""
force_path_style = false

[cache]
dir = "/var/lib/floe"
max_bytes = "5GiB"

[telemetry]
log_format = "json"
log_filter = "info"

# Not used by the facade image; listed so a deployment knows the switches exist.
# [github_mirror]                 # D49: needs roles ∋ "maintain" and the token env var (never the token here)
# enabled = true
# token_env = "FLOE_GITHUB_TOKEN"
# orgs = ["acme"]
# private_visible_to_all_readers = true
# [catalog]                       # D50: needs an image built with --features catalog
# enabled = true
# uri = "https://s3tables.us-east-1.amazonaws.com/iceberg"  # AWS S3 Tables (or RustFS: http://<rustfs>:9000/iceberg)
# warehouse = "arn:aws:s3tables:us-east-1:<account>:bucket/floe-catalog"
# auth = "sigv4"                  # D63: signed with the task role (D43 chain) unless AWS_ACCESS_KEY_ID/SECRET are set
# sigv4_service = "s3tables"      # RustFS: "s3"
# s3_region = "us-east-1"         # also the signing region (sigv4_region unset)
# s3_path_style = false           # AWS; RustFS: true, with s3_endpoint
