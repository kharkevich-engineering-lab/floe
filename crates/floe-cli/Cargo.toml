[package]
name = "floe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "floe"

[lib]
name = "floe_cli"
path = "src/lib.rs"

[[bin]]
name = "floe"
path = "src/bin/floe.rs"

[[bin]]
name = "floe-server"
path = "src/bin/floe-server.rs"

[dependencies]
floe-proto.workspace = true
floe-store.workspace = true
floe-config.workspace = true
floe-git.workspace = true
floe-wal.workspace = true
floe-server.workspace = true
floe-bundle = { path = "../floe-bundle", features = ["wal"] }
gix-hash.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
clap.workspace = true
mimalloc.workspace = true
rand.workspace = true
serde_json.workspace = true
serde.workspace = true
sha1.workspace = true
hex.workspace = true
chrono.workspace = true
humantime.workspace = true
tokio-util.workspace = true
futures.workspace = true
bytes.workspace = true
toml.workspace = true
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
axum.workspace = true
tempfile.workspace = true

[dev-dependencies]

[lints]
workspace = true
