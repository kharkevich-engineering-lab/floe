[package]
name = "floe-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The Iceberg writer for the audit tables (D50, `docs/design/github-mirror.md`
# §C). Off by default: without it the catalog core still compiles (Recorder,
# rows, cursor), and `catalog.enabled = true` is a fatal startup error.
catalog = ["floe-catalog/iceberg"]

[dependencies]
humantime.workspace = true
floe-proto.workspace = true
floe-store.workspace = true
floe-config.workspace = true
floe-git.workspace = true
floe-wal.workspace = true
floe-mirror.workspace = true
floe-catalog.workspace = true
async-trait.workspace = true
floe-bundle.workspace = true
floe-tls.workspace = true
anyhow.workspace = true
thiserror.workspace = true
bytes.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
serde.workspace = true
prost.workspace = true
prost-types.workspace = true
rust-embed.workspace = true
serde_json.workspace = true
libc.workspace = true
chrono.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
async-compression.workspace = true
gix-packetline.workspace = true
gix-hash.workspace = true
gix-object.workspace = true
gix-actor.workspace = true
gix-date.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
uuid.workspace = true
hex.workspace = true
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
rand.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
moka.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
base64.workspace = true

bytesize.workspace = true
ring.workspace = true
tokio-rustls.workspace = true
tempfile.workspace = true
graphql-parser.workspace = true
floe-codeintel = { workspace = true, optional = true, features = ["extract", "lang-rust", "lang-go", "lang-python", "lang-typescript", "lang-javascript", "lang-java"] }
rmcp = { workspace = true, optional = true }

[features]
# Code intelligence (D52, docs/design/code-intelligence.md). Off by default: the default build
# is unchanged, and `codeintel.enabled` / `mcp.enabled` in a binary without the feature is a
# fatal config error naming the flag (`check_build`).
codeintel = ["dep:floe-codeintel"]
# The MCP endpoints (D55); implies codeintel.
mcp = ["codeintel", "dep:rmcp"]

[dev-dependencies]
reqwest.workspace = true
rcgen.workspace = true

[lints]
workspace = true
