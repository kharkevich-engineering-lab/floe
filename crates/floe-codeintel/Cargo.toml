[package]
name = "floe-codeintel"
description = "Code intelligence core (D52): language detection, tree-sitter extraction and chunking. Bytes in, records out: no store, no tokio."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The library builds everything by default so `cargo test -p floe-codeintel` covers it; floe-server
# depends on it with default-features = false and enables exactly what its `codeintel` feature needs.
[features]
default = ["extract", "lang-rust", "lang-go", "lang-python", "lang-typescript", "lang-javascript", "lang-java"]
# tree-sitter extraction (defs, refs, outline) and syntax-aware chunking. Without it every file
# is `text`: line-window chunks only.
extract = ["dep:tree-sitter", "dep:streaming-iterator", "dep:regex"]
# One grammar per feature (C sources compiled by `cc`). The versions are pinned exactly: each is
# part of the language's extractor string (src/version.rs), so a bump re-extracts that language.
lang-rust = ["extract", "dep:tree-sitter-rust"]
lang-go = ["extract", "dep:tree-sitter-go"]
lang-python = ["extract", "dep:tree-sitter-python"]
# TypeScript and TSX (two grammars, one crate).
lang-typescript = ["extract", "dep:tree-sitter-typescript"]
# JavaScript and JSX.
lang-javascript = ["extract", "dep:tree-sitter-javascript"]
lang-java = ["extract", "dep:tree-sitter-java"]

[dependencies]
sha2.workspace = true
hex.workspace = true
tree-sitter = { version = "=0.27.0", optional = true }
streaming-iterator = { version = "0.1.9", optional = true }
regex = { version = "1", optional = true }
tree-sitter-rust = { version = "=0.24.2", optional = true }
tree-sitter-go = { version = "=0.25.0", optional = true }
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }
tree-sitter-javascript = { version = "=0.25.0", optional = true }
tree-sitter-java = { version = "=0.23.5", optional = true }

[lints]
workspace = true
