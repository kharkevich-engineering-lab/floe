[package]
name = "floe-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# The workspace floor (1.94.1) also covers iceberg 0.10's MSRV (1.94) when the
# `iceberg` feature is on.

[features]
default = []
# The Iceberg writer (arrow + parquet + opendal). Off by default: the core
# (rows, Recorder, buffer, cursor) compiles without it, so call sites have no cfg.
iceberg = [
    "dep:iceberg",
    "dep:iceberg-catalog-rest",
    "dep:iceberg-storage-opendal",
    "dep:arrow-array",
    "dep:reqwest",
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sigv4",
    "dep:axum",
    "dep:http",
    "dep:reqsign-core",
    "dep:tempfile",
]

[dependencies]
floe-proto.workspace = true
floe-store.workspace = true
floe-config.workspace = true
async-trait.workspace = true
chrono.workspace = true
metrics.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
iceberg = { workspace = true, optional = true }
iceberg-catalog-rest = { workspace = true, optional = true }
iceberg-storage-opendal = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
# Unifies rustls into the reqwest iceberg-catalog-rest builds without a TLS
# backend, so an https catalog URI works; also the SigV4 proxy's clients.
reqwest = { workspace = true, optional = true }
# `auth = "sigv4"` (src/sigv4.rs, D63): signing, the D43 credential chain, the
# in-process signing proxy on a Unix socket, and the FileIO credential loader.
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
reqsign-core = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
futures.workspace = true

[lints]
workspace = true
